<style>
:root{--bg:#f1ece1;--ink:#1c1a17;--muted:#7d766b;--line:#d9d2c4;--accent:#1c1a17;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--ink);font-family:'Poppins','Noto Sans KR','Noto Sans SC',sans-serif;font-weight:400;line-height:1.5;}
a{text-decoration:none;color:inherit;}

.top{position:sticky;top:0;z-index:20;background:rgba(241,236,225,0.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.topbar{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px;}
.back{font-size:13px;color:var(--muted);font-weight:500;}
.langs{display:flex;gap:4px;}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
.lang.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

.header{max-width:1040px;margin:0 auto;padding:34px 22px 6px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);}
.h-side{flex:1;font-size:13px;font-weight:600;letter-spacing:0.02em;}
.h-side.right{text-align:right;color:var(--muted);}
.h-logo img{height:52px;width:auto;display:block;}
.slogan b{font-weight:700;}
.price-note{max-width:1040px;margin:0 auto;padding:10px 22px 0;text-align:center;font-size:12px;color:var(--muted);}

.menu{max-width:1040px;margin:0 auto;padding:20px 22px 10px;column-count:2;column-gap:44px;}
@media(max-width:720px){.menu{column-count:1;}.header{flex-direction:column;gap:10px;}.h-side{text-align:center!important;}}
.sec{break-inside:avoid;margin-bottom:26px;}
.sec-h{font-size:23px;font-weight:700;letter-spacing:0.01em;margin-bottom:2px;}
.sec-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.sec-note{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:6px 0 18px;}
.item{padding:7px 0;}
.item-row{display:flex;align-items:baseline;gap:10px;}
.item-name{font-weight:600;font-size:15px;}
.new{color:#e0392b;font-size:10px;font-weight:700;margin-left:5px;vertical-align:top;letter-spacing:0.03em;}
.alg{font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:1px;white-space:nowrap;}
.allergy{max-width:1040px;margin:8px auto 0;padding:12px 22px;font-size:11.5px;color:var(--muted);text-align:center;line-height:2;border-top:1px solid var(--line);}
.allergy b{color:var(--ink);font-weight:700;}
.allergy .a{white-space:nowrap;margin:0 4px;}
.item-opt{font-size:11px;color:var(--muted);font-weight:500;}
.dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px);min-width:14px;}
.item-price{font-weight:700;font-size:15px;white-space:nowrap;}
.item-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;}

.foot{text-align:center;padding:24px 20px 40px;font-size:12px;color:var(--muted);border-top:2px solid var(--ink);max-width:1040px;margin:14px auto 0;}
.foot b{font-weight:700;color:var(--ink);}
</style>

function render(l){
  let h="";
  for(const s of SEC){
    h+='<div class="sec">';
    h+='<div class="sec-h">'+L(s.t,l)+'</div>';
    if(s.sub) h+='<div class="sec-sub">'+L(s.sub,l)+'</div>';
    for(const it of s.items){
      let opt="";
      if(it.o) opt=L(OPT[it.o],l);
      if(it.cream) opt=(opt?opt+" · ":"")+CREAM[l];
      h+='<div class="item"><div class="item-row"><span class="item-name">'+L(it.n,l)+(it.new?'<span class="new">new</span>':'')+'</span>'+(it.a?'<span class="alg">'+it.a.map(x=>CN[x]).join('')+'</span>':'');
      if(opt) h+='<span class="item-opt">'+opt+'</span>';
      h+='<span class="dots"></span><span class="item-price">'+it.p+'</span></div>';
      if(it.d) h+='<div class="item-desc">'+L(it.d,l)+'</div>';
      h+='</div>';
    }
    if(s.note) h+='<div class="sec-note">'+L(s.note,l)+'</div>';
    h+='</div>';
  }
  document.getElementById("menu").innerHTML=h;
}
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t][l]);
  render(l);
  document.getElementById('allergy').innerHTML='<b>'+T.allergyTitle[l]+'</b>&nbsp;&nbsp;'+ALG.map((a,i)=>a?'<span class="a">'+CN[i]+' '+a[l]+'</span>':'').join('');
}
